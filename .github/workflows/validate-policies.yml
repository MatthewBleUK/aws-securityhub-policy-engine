name: Validate Policies

on:
  pull_request:
    paths:
      - "policies/**"
  push:
    branches:
      - main
    paths:
      - "policies/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate policies
        run: python scripts/policies.py validate
