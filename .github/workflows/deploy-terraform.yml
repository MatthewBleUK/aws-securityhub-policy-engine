name: Deploy Terraform

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-terraform
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy Terraform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Configure required reviewers in GitHub to enable approval.
    environment: terraform-production
    defaults:
      run:
        working-directory: infrastructure
    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_repository: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Terraform inputs
        run: printf '%s\n' "$TF_VARS_JSON" > terraform.tfvars.json
        env:
          TF_VARS_JSON: ${{ vars.TF_VARS_JSON || '{}' }}

      - name: Initialize Terraform
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET:?Set TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY:?Set TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION:?Set TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Plan Terraform changes
        run: terraform plan -no-color -lock-timeout=5m -out=deploy.tfplan

      - name: Apply Terraform changes
        run: terraform apply -no-color -lock-timeout=5m deploy.tfplan
